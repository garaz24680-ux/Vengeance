<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vengeance Browser</title>
    <!-- Dynamic favicon -->
    <link rel="icon" type="image/png" id="site-favicon" href="browser.png">
    <style>
        :root {
            --glow-color: rgba(186, 85, 211, 0.8);
            --glow-spread: 0 0 15px var(--glow-color);
            --bg-dark: #07020d;
            --bg-purple: #1a002c;
            --text-color: #e0d0ff;
            --accent-glow: rgba(186, 85, 211, 0.5);
            --accent-glow-strong: rgba(216, 180, 254, 0.8);
            --border-color: rgba(186, 85, 211, 0.6);
            --active-tab-bg: rgba(80, 10, 120, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--bg-purple) 0%, var(--bg-dark) 100%);
        }

        /* Canvas for 3D Constellation Animation */
        #constellation-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* App Container Layout */
        .app-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Browser Controls */
        .browser-top {
            background: rgba(10, 2, 18, 0.7);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 20px var(--accent-glow);
            padding: 6px 10px;
        }

        .tab-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            overflow-x: auto;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(26, 0, 44, 0.6);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px 8px 0 0;
            font-size: 13px;
            cursor: pointer;
            box-shadow: var(--glow-spread);
            text-shadow: 0 0 5px var(--glow-color);
            transition: all 0.2s;
            max-width: 200px;
        }

        .tab.active {
            background: var(--active-tab-bg);
            border-color: var(--text-color);
            box-shadow: 0 0 20px var(--accent-glow-strong);
        }

        .tab-icon {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            pointer-events: none;
            flex-shrink: 0;
        }

        .tab-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .tab .close-tab {
            font-weight: bold;
            font-size: 14px;
            padding: 0 4px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tab .close-tab:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Plus Button */
        .add-tab-btn {
            background: rgba(26, 0, 44, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            box-shadow: none;
            text-shadow: none;
            color: var(--text-color);
            opacity: 0.7;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
        }

        .add-tab-btn:hover {
            background: var(--active-tab-bg);
            border-color: var(--text-color);
            opacity: 1;
            box-shadow: var(--glow-spread), 0 0 20px var(--accent-glow-strong);
            text-shadow: 0 0 8px var(--glow-color);
            transform: scale(1.05);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: rgba(15, 2, 25, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            font-size: 16px;
            box-shadow: none;
            text-shadow: none;
            color: var(--text-color);
            opacity: 0.3;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
        }

        .nav-btn.active {
            background: rgba(26, 0, 44, 0.8);
            border-color: var(--border-color);
            color: var(--text-color);
            opacity: 1;
            cursor: pointer;
            box-shadow: var(--glow-spread);
            text-shadow: 0 0 8px var(--glow-color);
        }

        .nav-btn.active:hover {
            border-color: var(--text-color);
            box-shadow: 0 0 20px var(--accent-glow-strong);
            transform: scale(1.05);
        }

        .nav-btn.active:active {
            transform: scale(0.95);
        }

        .top-search-bar {
            flex: 1;
            background: rgba(15, 2, 25, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 16px;
            outline: none;
            box-shadow: var(--glow-spread);
            text-shadow: 0 0 5px var(--glow-color);
            font-size: 14px;
        }

        .top-search-bar:focus {
            border-color: var(--text-color);
            box-shadow: 0 0 25px var(--accent-glow-strong);
        }

        .top-settings-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
            text: white;
        }

        .top-settings-btn img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px var(--glow-color));
        }

        .top-settings-btn:hover {
            transform: scale(1.15) rotate(30deg);
        }

        /* Perfectly Centered Content Area */
        .center-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            z-index: 2;
        }

        .title-container {
            margin-bottom: 35px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .title-img {
            max-width: 750px;
            width: 85vw;
            height: auto;
            filter: drop-shadow(0 0 35px var(--glow-color)) drop-shadow(0 0 70px var(--accent-glow));
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 25px var(--glow-color)) drop-shadow(0 0 45px var(--accent-glow)); }
            100% { filter: drop-shadow(0 0 45px var(--text-color)) drop-shadow(0 0 90px var(--glow-color)); }
        }

        /* Search Box in Center Stage */
        .middle-search-box {
            display: flex;
            align-items: center;
            background: rgba(20, 3, 32, 0.85);
            border: 2px solid var(--border-color);
            border-radius: 40px;
            padding: 10px 18px 10px 24px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 15px var(--border-color);
            backdrop-filter: blur(5px);
        }

        .engine-dropdown {
            background: transparent;
            border: none;
            border-right: 1px solid var(--border-color);
            padding-right: 14px;
            margin-right: 14px;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            text-shadow: 0 0 5px var(--glow-color);
        }

        .engine-dropdown option {
            background: #10021c;
            color: var(--text-color);
        }

        .middle-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 18px;
            text-shadow: 0 0 5px var(--glow-color);
        }

        .search-arrow-btn {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 10px;
            text-shadow: 0 0 8px var(--glow-color);
            transition: transform 0.2s;
        }

        .search-arrow-btn:hover {
            transform: scale(1.25);
        }

        /* Shortcuts Container */
        .shortcuts-container {
            display: flex;
            gap: 20px;
            margin-top: 32px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 800px;
            width: 100%;
        }

        .shortcut-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(26, 0, 44, 0.85);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--glow-spread);
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        .shortcut-btn:hover {
            transform: translateY(-4px) scale(1.12);
            border-color: var(--text-color);
            box-shadow: 0 0 30px var(--accent-glow-strong);
        }

        .shortcut-btn img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Views Container */
        #views-container {
            flex: 1;
            width: 100%;
            position: relative;
            display: flex;
        }

        .tab-view {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            display: none;
        }

        .tab-view.active {
            display: block;
        }

        /* --- SETTINGS POPUP MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .settings-modal {
            background: rgba(18, 4, 28, 0.95);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 40px var(--glow-color);
            border-radius: 16px;
            width: 90%;
            max-width: 620px;
            min-height: 440px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modal-open 0.25s ease-out;
        }

        @keyframes modal-open {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 2, 18, 0.8);
        }

        .modal-header h2 {
            font-size: 20px;
            text-shadow: 0 0 10px var(--glow-color);
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-color);
            transition: transform 0.2s;
        }

        .modal-close-btn:hover {
            transform: scale(1.2);
        }

        .settings-nav {
            display: flex;
            background: rgba(10, 2, 18, 0.5);
            border-bottom: 1px solid var(--border-color);
        }

        .settings-tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .settings-tab-btn.active {
            border-bottom-color: var(--glow-color);
            background: var(--active-tab-bg);
            box-shadow: inset 0 -5px 15px var(--accent-glow);
        }

        .settings-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .settings-panel {
            display: none;
        }

        .settings-panel.active {
            display: block;
        }

        /* Cloak Tab Styling */
        .cloak-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .cloak-btn {
            aspect-ratio: 1;
            background: rgba(30, 8, 45, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px;
        }

        .cloak-btn:hover {
            border-color: var(--text-color);
            box-shadow: 0 0 15px var(--glow-color);
            transform: translateY(-2px);
        }

        .cloak-btn.active {
            border-color: #ffffff;
            background: var(--active-tab-bg);
            box-shadow: 0 0 20px var(--glow-color);
        }

        .cloak-btn img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .cloak-btn span {
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .custom-cloak-sec {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .settings-input {
            width: 100%;
            background: rgba(10, 2, 18, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            outline: none;
            font-size: 14px;
        }

        .settings-input:focus {
            border-color: var(--text-color);
            box-shadow: 0 0 10px var(--glow-color);
        }

        .reset-cloak-btn {
            align-self: flex-start;
            padding: 8px 16px;
            background: rgba(180, 20, 50, 0.6);
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .reset-cloak-btn:hover {
            background: rgba(220, 20, 50, 0.9);
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.8);
        }

        /* Panic Tab Styling */
        .panic-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .key-recorder {
            background: rgba(10, 2, 18, 0.8);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .key-recorder.recording {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            animation: pulse-border 1s infinite alternate;
        }

        @keyframes pulse-border {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        /* Theme Tab Styling with Larger Rounded Squares & Active Glow */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .theme-btn {
            aspect-ratio: 1;
            background: rgba(20, 3, 32, 0.8);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--glow-color);
        }

        /* Active selected theme button lights up */
        .theme-btn.active {
            border-color: #ffffff;
            background: var(--active-tab-bg);
            box-shadow: 0 0 25px var(--glow-color);
        }

        /* BIGGER theme color square swatch */
        .theme-color-square {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Quick Searches Tab Styling */
        .qs-manager {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .qs-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .qs-item {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(26, 0, 44, 0.85);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qs-item img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .qs-item .delete-qs {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff4d4d;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #fff;
            box-shadow: 0 0 5px rgba(255, 77, 77, 0.8);
        }

        .add-qs-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            padding: 15px;
            background: rgba(10, 2, 18, 0.6);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .action-btn {
            padding: 8px 16px;
            background: var(--active-tab-bg);
            border: 1px solid var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            align-self: flex-start;
            transition: all 0.2s;
        }

        .action-btn:hover {
            box-shadow: 0 0 15px var(--glow-color);
        }
    </style>
</head>
<body>

    <canvas id="constellation-canvas"></canvas>

    <div class="app-container">
        <!-- Top Browser Area -->
        <div class="browser-top">
            <div class="tab-bar" id="tab-bar">
                <div class="tab active" data-id="1" onclick="switchTab(1)">
                    <img src="browser.png" class="tab-icon" alt="tab icon" onerror="this.style.display='none'">
                    <span class="tab-title">Vengeance Browser</span>
                    <span class="close-tab" onclick="closeTab(event, 1)">✕</span>
                </div>
                <div class="add-tab-btn" onclick="addTab()">+</div>
            </div>

            <div class="nav-controls">
                <div class="nav-btn active" id="reset-btn" onclick="resetTab()" title="Reset Tab">⟳</div>
                <div class="nav-btn" id="back-btn" onclick="goBack()" title="Back">←</div>
                <div class="nav-btn" id="forward-btn" onclick="goForward()" title="Forward">→</div>
                <input type="text" class="top-search-bar" id="top-search" value="vengeance://browser" placeholder="Enter URL or search term..." onkeydown="handleTopSearch(event)">
                <button class="top-settings-btn" onclick="openSettingsModal()" title="Settings">
                    <img src="settings.png" alt="Settings" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3524/3524659.png'">
                </button>
            </div>
        </div>

        <!-- Center Search Area (Home View) -->
        <div class="center-stage" id="center-stage">
            <div class="title-container">
                <img src="title.png" alt="Vengeance" class="title-img" onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
                <h1 id="fallback-title" style="display:none; font-size: 6rem; text-shadow: 0 0 45px #ba55d3;">VENGEANCE</h1>
            </div>

            <!-- Centered Search Box -->
            <div class="middle-search-box">
                <select class="engine-dropdown" id="engine-select">
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="google">Google</option>
                    <option value="brave">Brave</option>
                    <option value="bing">Bing</option>
                </select>
                <input type="text" class="middle-input" id="middle-search" placeholder="Search..." onkeydown="handleMiddleSearch(event)">
                <button class="search-arrow-btn" onclick="submitSearch()">➔</button>
            </div>

            <!-- Shortcuts Container -->
            <div class="shortcuts-container" id="shortcuts-container"></div>
        </div>

        <!-- Active Web Output Container for Tab Frames -->
        <div id="views-container"></div>
    </div>

    <!-- SETTINGS POPUP MODAL -->
    <div class="modal-overlay" id="settings-modal-overlay">
        <div class="settings-modal">
            <div class="modal-header">
                <h2>Vengeance Settings</h2>
                <button class="modal-close-btn" onclick="closeSettingsModal()">✕</button>
            </div>
            
            <div class="settings-nav">
                <button class="settings-tab-btn active" onclick="switchSettingsTab('cloak', event)">Cloak</button>
                <button class="settings-tab-btn" onclick="switchSettingsTab('panic', event)">Panic</button>
                <button class="settings-tab-btn" onclick="switchSettingsTab('theme', event)">Theme</button>
                <button class="settings-tab-btn" onclick="switchSettingsTab('quicksearches', event)">Quick Searches</button>
                <button class="settings-tab-btn" onclick="switchSettingsTab('dangerzone', event)" style="text: #f00707;">Danger Zone</button>
            </div>

            <div class="settings-body">
                <!-- Advanced Cloak Panel -->
                <div class="settings-panel active" id="panel-cloak">
                    <div class="cloak-grid">
                        <div class="cloak-btn" onclick="setCloak('Wikipedia', 'https://wikipedia.org/favicon.ico', this)">
                            <img src="https://wikipedia.org/favicon.ico" alt="Wikipedia">
                            <span>Wikipedia</span>
                        </div>
                        <div class="cloak-btn" onclick="setCloak('Google Docs', 'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico', this)">
                            <img src="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico" alt="Google Docs">
                            <span>Google Docs</span>
                        </div>
                        <div class="cloak-btn" onclick="setCloak('Google Drive', 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png', this)">
                            <img src="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" alt="Google Drive">
                            <span>Google Drive</span>
                        </div>
                        <div class="cloak-btn" onclick="setCloak('Google', 'https://www.google.com/favicon.ico', this)">
                            <img src="https://www.google.com/favicon.ico" alt="Google">
                            <span>Google</span>
                        </div>
                        <div class="cloak-btn" onclick="setCloak('Google Classroom', 'https://ssl.gstatic.com/classroom/favicon.png', this)">
                            <img src="https://ssl.gstatic.com/classroom/favicon.png" alt="Classroom">
                            <span>Google Class</span>
                        </div>
                        <div class="cloak-btn" onclick="setCloak('Google Slides', 'https://ssl.gstatic.com/docs/presentations/images/favicon5.ico', this)">
                            <img src="https://ssl.gstatic.com/docs/presentations/images/favicon5.ico" alt="Google Slides">
                            <span>Google Slides</span>
                        </div>
                        <div class="cloak-btn" onclick="setCloak('Canva', 'https://static.canva.com/static/images/favicon.ico', this)">

    <script>
        // --- 1. RASPBERRY PI SERVER CONFIGURATION ---
        const RASPBERRY_PI_SERVER = "http://192.168.1.100:5000"; 

        // --- 2. 3D Constellation Background Animation ---
        const canvas = document.getElementById('constellation-canvas');
        const ctx = canvas.getContext('2d');

        let points = [];
        const numPoints = 65;
        const maxDistance = 130;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Point3D {
            constructor() {
                this.x = (Math.random() - 0.5) * canvas.width * 1.5;
                this.y = (Math.random() - 0.5) * canvas.height * 1.5;
                this.z = Math.random() * 400 + 100;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.vz = (Math.random() - 0.5) * 0.8;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;

                if (Math.abs(this.x) > canvas.width) this.vx *= -1;
                if (Math.abs(this.y) > canvas.height) this.vy *= -1;
                if (this.z < 50 || this.z > 500) this.vz *= -1;
            }

            project() {
                const fov = 350;
                const scale = fov / (fov + this.z);
                return {
                    x: this.x * scale + canvas.width / 2,
                    y: this.y * scale + canvas.height / 2,
                    scale: scale
                };
            }
        }

        for (let i = 0; i < numPoints; i++) {
            points.push(new Point3D());
        }

        function animateConstellations() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let projected = points.map(p => {
                p.update();
                return p.project();
            });

            for (let i = 0; i < projected.length; i++) {
                let p1 = projected[i];

                ctx.beginPath();
                ctx.arc(p1.x, p1.y, 2.5 * p1.scale, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(216, 180, 254, ${p1.scale})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'var(--glow-color)';
                ctx.fill();

                for (let j = i + 1; j < projected.length; j++) {
                    let p2 = projected[j];
                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        let alpha = (1 - dist / maxDistance) * 0.4 * p1.scale;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(186, 85, 211, ${alpha})`;
                        ctx.lineWidth = 1 * p1.scale;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateConstellations);
        }
        animateConstellations();


        // --- 3. Per-Tab Data Management System ---
        let tabCounter = 1;
        let activeTabId = 1;

        let tabsData = {
            1: {
                title: "Vengeance Browser",
                history: ["vengeance://browser"],
                historyIndex: 0,
                isHome: true
            }
        };

        function addTab() {
            tabCounter++;
            const newId = tabCounter;
            
            tabsData[newId] = {
                title: "Vengeance Browser",
                history: ["vengeance://browser"],
                historyIndex: 0,
                isHome: true
            };

            const tabBar = document.getElementById('tab-bar');
            const addBtn = document.querySelector('.add-tab-btn');

            const newTab = document.createElement('div');
            newTab.className = 'tab';
            newTab.dataset.id = newId;
            newTab.onclick = () => switchTab(newId);
            newTab.innerHTML = `
                <img src="browser.png" class="tab-icon" alt="tab icon" onerror="this.style.display='none'">
                <span class="tab-title">Vengeance Browser</span>
                <span class="close-tab" onclick="closeTab(event, ${newId})">✕</span>
            `;

            tabBar.insertBefore(newTab, addBtn);

            const viewsContainer = document.getElementById('views-container');
            const newFrame = document.createElement('iframe');
            newFrame.className = 'tab-view';
            newFrame.id = `view-${newId}`;
            viewsContainer.appendChild(newFrame);

            switchTab(newId);
        }

        function switchTab(tabId) {
            if (!tabsData[tabId]) return;
            activeTabId = tabId;

            document.querySelectorAll('.tab').forEach(t => {
                if (parseInt(t.dataset.id) === tabId) {
                    t.classList.add('active');
                } else {
                    t.classList.remove('active');
                }
            });

            const currentTabData = tabsData[tabId];
            const centerStage = document.getElementById('center-stage');

            document.querySelectorAll('.tab-view').forEach(frame => {
                frame.classList.remove('active');
            });

            if (currentTabData.isHome) {
                centerStage.style.display = 'flex';
                document.getElementById('middle-search').value = '';
            } else {
                centerStage.style.display = 'none';
                const activeFrame = document.getElementById(`view-${tabId}`);
                if (activeFrame) activeFrame.classList.add('active');
            }

            const currentUrl = currentTabData.history[currentTabData.historyIndex];
            document.getElementById('top-search').value = currentUrl;

            updateNavButtonsUI();
        }

        function closeTab(event, tabId) {
            event.stopPropagation();
            const tabElements = document.querySelectorAll('.tab');
            if (tabElements.length <= 1) return;

            const targetTab = document.querySelector(`.tab[data-id="${tabId}"]`);
            const targetFrame = document.getElementById(`view-${tabId}`);

            if (targetTab) targetTab.remove();
            if (targetFrame) targetFrame.remove();

            delete tabsData[tabId];

            if (activeTabId === tabId) {
                const remainingTabs = Object.keys(tabsData);
                const nextTabId = parseInt(remainingTabs[remainingTabs.length - 1]);
                switchTab(nextTabId);
            }
        }

        function resetTab() {
            const currentData = tabsData[activeTabId];
            if (!currentData) return;

            currentData.isHome = true;
            currentData.title = "Vengeance Browser";
            currentData.history.push("vengeance://browser");
            currentData.historyIndex = currentData.history.length - 1;

            updateTabTitleUI(activeTabId, "Vengeance Browser");
            switchTab(activeTabId);
        }

        function updateNavButtonsUI() {
            const currentData = tabsData[activeTabId];
            const backBtn = document.getElementById('back-btn');
            const forwardBtn = document.getElementById('forward-btn');

            if (!currentData) return;

            if (currentData.historyIndex > 0) {
                backBtn.classList.add('active');
            } else {
                backBtn.classList.remove('active');
            }

            if (currentData.historyIndex < currentData.history.length - 1) {
                forwardBtn.classList.add('active');
            } else {
                forwardBtn.classList.remove('active');
            }
        }

        function goBack() {
            const currentData = tabsData[activeTabId];
            if (currentData && currentData.historyIndex > 0) {
                currentData.historyIndex--;
                const prevUrl = currentData.history[currentData.historyIndex];
                loadUrlInTab(activeTabId, prevUrl, false);
            }
        }

        function goForward() {
            const currentData = tabsData[activeTabId];
            if (currentData && currentData.historyIndex < currentData.history.length - 1) {
                currentData.historyIndex++;
                const nextUrl = currentData.history[currentData.historyIndex];
                loadUrlInTab(activeTabId, nextUrl, false);
            }
        }

        function updateTabTitleUI(tabId, titleText) {
            const tabElement = document.querySelector(`.tab[data-id="${tabId}"] .tab-title`);
            if (tabElement) {
                tabElement.textContent = titleText;
            }
        }

        // --- 4. Search & Server Routing Logic ---
        function handleMiddleSearch(e) {
            if (e.key === 'Enter') submitSearch();
        }

        function handleTopSearch(e) {
            if (e.key === 'Enter') {
                const inputVal = document.getElementById('top-search').value;
                executeSearch(inputVal, true);
            }
        }

        function submitSearch() {
            const query = document.getElementById('middle-search').value;
            executeSearch(query, true);
        }

        function quickLaunch(url) {
            document.getElementById('middle-search').value = url;
            executeSearch(url, true);
        }

        function executeSearch(query, recordHistory = true) {
            if (!query.trim()) return;

            let displayUrl = query;
            let targetTitle = query;

            if (query === 'vengeance://browser') {
                resetTab();
                return;
            }

            const isDirectUrl = query.startsWith('http://') || query.startsWith('https://') || (query.includes('.') && !query.includes(' '));

            if (!isDirectUrl) {
                const selectedEngine = document.getElementById('engine-select').value;
                displayUrl = `vengeance://search?q=${encodeURIComponent(query)}`;
                targetTitle = `${query} - Search`;
            } else {
                if (!displayUrl.startsWith('http')) {
                    displayUrl = 'https://' + displayUrl;
                }
                try {
                    const parsedUrl = new URL(displayUrl);
                    targetTitle = parsedUrl.hostname.replace('www.', '');
                } catch {
                    targetTitle = query;
                }
            }

            loadUrlInTab(activeTabId, displayUrl, recordHistory, targetTitle, query);
        }

        function loadUrlInTab(tabId, displayUrl, recordHistory = true, tabTitle = null, rawQuery = "") {
            const currentData = tabsData[tabId];
            if (!currentData) return;

            if (recordHistory) {
                currentData.history = currentData.history.slice(0, currentData.historyIndex + 1);
                currentData.history.push(displayUrl);
                currentData.historyIndex = currentData.history.length - 1;
            }

            currentData.isHome = false;

            if (!tabTitle) {
                if (displayUrl === 'vengeance://browser') {
                    tabTitle = "Vengeance Browser";
                    currentData.isHome = true;
                } else if (displayUrl.startsWith('vengeance://search')) {
                    const params = new URLSearchParams(displayUrl.split('?')[1]);
                    tabTitle = (params.get('q') || 'Search') + " - Search";
                } else {
                    try {
                        const parsedUrl = new URL(displayUrl);
                        tabTitle = parsedUrl.hostname.replace('www.', '');
                    } catch {
                        tabTitle = displayUrl;
                    }
                }
            }

            currentData.title = tabTitle;
            updateTabTitleUI(tabId, tabTitle);

            const centerStage = document.getElementById('center-stage');
            let frame = document.getElementById(`view-${tabId}`);

            if (!frame) {
                const viewsContainer = document.getElementById('views-container');
                frame = document.createElement('iframe');
                frame.className = 'tab-view';
                frame.id = `view-${tabId}`;
                viewsContainer.appendChild(frame);
            }

            if (currentData.isHome) {
                centerStage.style.display = 'flex';
                frame.classList.remove('active');
            } else {
                centerStage.style.display = 'none';
                frame.classList.add('active');

                    const selectedEngine = document.getElementById('engine-select').value;
    const searchQuery = rawQuery || displayUrl;

    // Fixes the link automatically if they forget https://
    let finalSearchQuery = searchQuery.trim();
    if (finalSearchQuery.includes('.') && !finalSearchQuery.includes(' ') && !finalSearchQuery.startsWith('http')) {
        finalSearchQuery = 'https://' + finalSearchQuery;
    }

    // Sends the perfectly fixed link to your Raspberry Pi
    const serverSearchEndpoint = `${RASPBERRY_PI_SERVER}/search?engine=${encodeURIComponent(selectedEngine)}&q=${encodeURIComponent(finalSearchQuery)}`;

    frame.src = serverSearchEndpoint;

                frame.src = serverSearchEndpoint;
            }

            document.getElementById('top-search').value = displayUrl;
            updateNavButtonsUI();
        }

        // --- 5. SETTINGS POPUP LOGIC ---
        function openSettingsModal() {
            document.getElementById('settings-modal-overlay').classList.add('active');
            renderQuickSearchSettings();

            document.getElementById('settings-modal-overlay').classList.remove('active');

            document.querySelectorAll('.settings-tab-btn').forEach(b => b.classList.remove('active'));

        // --- ADVANCED CLOAK LOGIC ---
        function setCloak(title, iconUrl, el = null) {
            document.querySelectorAll('.cloak-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');

            document.title = title;
            document.getElementById('site-favicon').href = iconUrl;

            document.getElementById('custom-cloak-title').value = '';
            document.getElementById('custom-cloak-icon').value = '';

        function handleCustomCloakInput() {
            document.querySelectorAll('.cloak-btn').forEach(b => b.classList.remove('active'));

            const titleVal = document.getElementById('custom-cloak-title').value || "Vengeance Browser";
            let iconInput = document.getElementById('custom-cloak-icon').value.trim();
            let iconVal = "browser.png";

            if (iconInput) {
                if (iconInput.startsWith('http://') || iconInput.startsWith('https://') || iconInput.includes('.')) {
                    iconVal = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(iconInput)}&sz=64`;

                    iconVal = iconInput;
                }

            document.title = titleVal;
            document.getElementById('site-favicon').href = iconVal;

            document.querySelectorAll('.cloak-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('custom-cloak-title').value = '';
            document.getElementById('custom-cloak-icon').value = '';

            document.title = "Vengeance Browser";
            document.getElementById('site-favicon').href = "browser.png";

        // --- PANIC KEY LOGIC ---
        let panicKey = null;
        let isRecordingPanic = false;

        function startKeyRecording() {
            const recorder = document.getElementById('key-recorder');
            recorder.classList.add('recording');
            recorder.innerText = "Press ANY key now...";
            isRecordingPanic = true;
        }

        window.addEventListener('keydown', (e) => {
            if (isRecordingPanic) {
                panicKey = e.key;
                isRecordingPanic = false;
                const recorder = document.getElementById('key-recorder');
                recorder.classList.remove('recording');
                recorder.innerText = `Click to record Panic Key (Current: ${panicKey})`;

                const targetUrl = document.getElementById('panic-url-input').value || "https://google.com";
                window.location.href = targetUrl.startsWith('http') ? targetUrl : 'https://' + targetUrl;
            }
        });

        // --- THEME LOGIC (EVERYTHING CUSTOMIZED PER THEME) ---
        const themeMap = {
            red: { glow: 'rgba(229, 57, 53, 0.8)', bg: '#2b0000', dark: '#0a0000', text: '#ffcdd2', border: 'rgba(229, 57, 53, 0.6)', active: 'rgba(180, 20, 30, 0.8)' },

            cyan: { glow: 'rgba(0, 172, 193, 0.8)', bg: '#00262b', dark: '#00090a', text: '#b2ebf2', border: 'rgba(0, 172, 193, 0.6)', active: 'rgba(0, 120, 140, 0.8)' },
            purple: { glow: 'rgba(186, 85, 211, 0.8)', bg: '#1a002c', dark: '#07020d', text: '#e0d0ff', border: 'rgba(186, 85, 211, 0.6)', active: 'rgba(80, 10, 120, 0.8)' },
            pink: { glow: 'rgba(216, 27, 96, 0.8)', bg: '#2b0019', dark: '#0a0006', text: '#f8bbd0', border: 'rgba(216, 27, 96, 0.6)', active: 'rgba(160, 10, 70, 0.8)' },

            teal: { glow: 'rgba(0, 137, 123, 0.85)', bg: '#002322', dark: '#000a0a', text: '#b2dfdb', border: 'rgba(0, 137, 123, 0.65)', active: 'rgba(0, 105, 92, 0.85)' }
        };

            const t = themeMap[colorName] || themeMap.purple;

            document.documentElement.style.setProperty('--glow-color', t.glow);
            document.documentElement.style.setProperty('--bg-purple', t.bg);
            document.documentElement.style.setProperty('--bg-dark', t.dark);

            document.documentElement.style.setProperty('--accent-glow-strong', t.glow);

            // Light up the active theme button
            document.querySelectorAll('.theme-btn').forEach(btn => {

                    btn.classList.add('active');

                    btn.classList.remove('active');
                }
            });
        }

        // --- QUICK SEARCHES LOGIC ---
        let quickSearches = [
            { url: 'https://youtube.com', icon: 'https://www.youtube.com/favicon.ico' },
            { url: 'https://github.com', icon: 'https://github.githubassets.com/favicons/favicon.png' },

            { url: 'https://discord.com', icon: 'https://www.google.com/s2/favicons?domain=discord.com&sz=64' },

        ];

        function renderShortcuts() {
            const container = document.getElementById('shortcuts-container');
            container.innerHTML = '';

            quickSearches.forEach(qs => {
                const btn = document.createElement('div');
                btn.className = 'shortcut-btn';
                btn.onclick = () => quickLaunch(qs.url);
                btn.innerHTML = `<img src="${qs.icon}" alt="shortcut">`;
                container.appendChild(btn);
            });
        }

        function renderQuickSearchSettings() {
            const list = document.getElementById('qs-settings-list');
            list.innerHTML = '';

            quickSearches.forEach((qs, index) => {
                const item = document.createElement('div');
                item.className = 'qs-item';
                item.innerHTML = `<img src="${qs.icon}" alt="qs">`;

                const delBtn = document.createElement('div');
                delBtn.className = 'delete-qs';
                delBtn.innerText = '✕';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteQuickSearch(index);
                };

                item.appendChild(delBtn);
                list.appendChild(item);
            });
        }

        function deleteQuickSearch(index) {
            quickSearches.splice(index, 1);
            renderShortcuts();
            renderQuickSearchSettings();
        }

        function addQuickSearch() {
            if (quickSearches.length >= 10) {
                alert("Maximum limit of 10 shortcuts reached!");
                return;
            }

            let url = document.getElementById('new-qs-url').value.trim();

            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;

            // Automatically fetch favicon based on input URL
            const icon = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(url)}&sz=64`;

            quickSearches.push({ url, icon });
            document.getElementById('new-qs-url').value = '';

            renderShortcuts();
            renderQuickSearchSettings();
        }

        // Initial setup
        renderShortcuts();
    </script>
</body>
</html>
